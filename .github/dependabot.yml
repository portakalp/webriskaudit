version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in backend/Dockerfile and frontend/Dockerfile (tag and digest).
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly

  # Provider versions in infra/gcp (versions.tf and .terraform.lock.hcl).
  - package-ecosystem: terraform
    directory: /infra/gcp
    schedule:
      interval: weekly
