name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Check that lib/api-types.ts matches backend/openapi.json
        # ls-files fails when the file is not committed, which git diff would miss.
        run: |
          git ls-files --error-unmatch lib/api-types.ts
          pnpm gen:api
          git diff --exit-code -- lib/api-types.ts
      - run: pnpm build

  backend:
    name: Backend (lint, types, tests, OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Check that openapi.json matches the code
        # ls-files fails when the file is not committed, which git diff would miss.
        run: |
          git ls-files --error-unmatch openapi.json
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  docker:
    name: Docker images (build, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the Dockerfiles
        run: |
          docker build --check backend
          docker build --check frontend
      # Builds both images locally from compose.yaml; nothing is pushed.
      - name: Build both images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/privacy-policy
          curl -fsSI http://localhost:3000/ \
            | grep -iq "^content-security-policy: .*connect-src 'self' http://localhost:8000;"
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/backend-requirements.txt"

  terraform:
    name: Terraform (format, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # No backend and no credentials: providers come from the public registry,
      # checked against the committed lock file.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
