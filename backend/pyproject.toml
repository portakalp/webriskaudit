[project]
name = "webriskaudit"
version = "2.0.0"
description = "Passive security posture scanner for domains"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Taha Gökalp Bakar" }]
dependencies = [
    "certifi>=2026.10.23",
    "dnspython>=2.9",
    "fastapi>=0.160",
    "httpx>=0.28.1",
    "idna>=3.20",
    "pydantic>=2.14",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-socket>=0.8",
    "ruff>=0.17",
    "trustme>=1.2.1",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webriskaudit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests never leave the machine: fakes stand in for DNS, HTTP and TLS, and sockets
# are disabled except loopback (127.0.0.1) for tests/test_tls_loopback.py.
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
