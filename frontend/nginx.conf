# nginx server for the WebRiskAudit site in the Docker image (see Dockerfile).
# It is included in the http block of the base image's /etc/nginx/nginx.conf.
#
# Production runs on Cloudflare Pages, which reads public/_headers. This file
# sends the same security headers; keep the two in sync. The Dockerfile fills
# in the API_ORIGIN placeholder of connect-src with the origin of
# NEXT_PUBLIC_API_URL, so the CSP allows the API that the build calls (nginx
# rejects the file while the placeholder is still there).

# Like the API, the access log leaves out client addresses.
log_format webriskaudit '[$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/webriskaudit;

    access_log /var/log/nginx/access.log webriskaudit;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # "merge" keeps these headers in locations that add their own.
    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Clean URLs: /privacy-policy serves privacy-policy.html. Pages are
    # revalidated on every visit, as on Cloudflare Pages.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Build assets have content-hashed names and never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
